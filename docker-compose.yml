services:
  postgres:
    image: postgres:16-alpine
    container_name: cca-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cca}
      POSTGRES_USER: ${DB_USERNAME:-cca}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cca_secret}
    volumes:
      - cca-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cca} -d ${DB_DATABASE:-cca}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - cca

  app:
    build: .
    image: cca-app:local
    container_name: cca-app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - cca-vendor:/var/www/html/vendor
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: ${PUBLIC_APP_URL:-http://localhost:8000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-cca}
      DB_USERNAME: ${DB_USERNAME:-cca}
      DB_PASSWORD: ${DB_PASSWORD:-cca_secret}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-cca-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-cca-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-cca-reverb-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      reverb:
        condition: service_started
    command: ["serve"]
    networks:
      - cca
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  reverb:
    image: cca-app:local
    build: .
    container_name: cca-reverb
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
      - cca-vendor:/var/www/html/vendor
    env_file:
      - .env
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-cca}
      DB_USERNAME: ${DB_USERNAME:-cca}
      DB_PASSWORD: ${DB_PASSWORD:-cca_secret}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-cca-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-cca-reverb-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-cca-reverb-secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    command: ["reverb"]
    networks:
      - cca

  # Cloudflare quick tunnel — public HTTPS URL cho điện thoại scan QR
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cca-tunnel
    command: tunnel --url http://app:8000 --no-autoupdate
    depends_on:
      app:
        condition: service_started
    networks:
      - cca
    profiles:
      - tunnel

networks:
  cca:

volumes:
  cca-vendor:
  cca-postgres:
